<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1080" role="img" aria-labelledby="title desc">
  <title id="title">Denartist logo</title>
  <desc id="desc">Denartist wordmark with a tooth and brush emblem and the tagline where dentistry meets art.</desc>
  <defs>
    <linearGradient id="ivoryStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff9ef"/>
      <stop offset="100%" stop-color="#efd6a3"/>
    </linearGradient>
    <linearGradient id="goldStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe0a6"/>
      <stop offset="30%" stop-color="#cfa24a"/>
      <stop offset="70%" stop-color="#f7d382"/>
      <stop offset="100%" stop-color="#7c4f16"/>
    </linearGradient>
    <linearGradient id="brushMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0cb77"/>
      <stop offset="100%" stop-color="#9c6920"/>
    </linearGradient>
    <linearGradient id="bristle" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0c470"/>
      <stop offset="55%" stop-color="#9f4c2f"/>
      <stop offset="100%" stop-color="#3f140f"/>
    </linearGradient>
    <linearGradient id="ivoryText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fff8eb"/>
      <stop offset="100%" stop-color="#f2e0b8"/>
    </linearGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c99233"/>
      <stop offset="50%" stop-color="#f0d485"/>
      <stop offset="100%" stop-color="#b87b21"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>

