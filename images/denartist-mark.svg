<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-labelledby="title desc">
  <title id="title">Denartist emblem</title>
  <desc id="desc">A tooth outline meeting an artist brush with colorful paint splash accents.</desc>
  <defs>
    <linearGradient id="ivoryStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff9ef"/>
      <stop offset="100%" stop-color="#efd6a3"/>
    </linearGradient>
    <linearGradient id="goldStroke" x1="0%" y1="0%" x2="100%" y2="100%">
