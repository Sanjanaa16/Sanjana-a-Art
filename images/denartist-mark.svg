      <stop offset="30%" stop-color="#cfa24a"/>
      <stop offset="70%" stop-color="#f7d382"/>
      <stop offset="100%" stop-color="#7c4f16"/>
    </linearGradient>
    <linearGradient id="brushMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0cb77"/>
      <stop offset="100%" stop-color="#9c6920"/>
    </linearGradient>
    <linearGradient id="bristle" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0c470"/>
      <stop offset="55%" stop-color="#9f4c2f"/>
      <stop offset="100%" stop-color="#3f140f"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>

